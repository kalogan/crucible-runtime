# Workspace boundary: pnpm resolves the nearest pnpm-workspace.yaml upward.
# Declaring this project its own (single-package) workspace root stops the
# walk, so installs can never be captured by a stray ancestor workspace file
# (e.g. one above a temp dir or user profile).
packages:
  - "."

# esbuild works via its @esbuild/* optional-dependency binaries; its build
# script is an optimization we deliberately never run (no dependency code
# execution at install). Declaring it here keeps strict build-approval
# machines (strict-dep-builds / ERR_PNPM_IGNORED_BUILDS) quiet and identical
# to the default-ignore behavior everywhere else.
ignoredBuiltDependencies:
  - esbuild
